name: Build and publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'healthcheck/**'
      - '.github/workflows/build-publish.yml'
  workflow_dispatch:
    inputs:
      GOST_VERSION:
        # https://github.com/ginuerzh/gost/releases
        description: "Version of gost. If empty, the latest version will be used."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        variants:
          - base_image: debian:13-slim
            suite: trixie
            tag_suffix: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get gost version
        id: get-gost-version
        env:
          INPUT_GOST_VERSION: ${{ inputs.GOST_VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$INPUT_GOST_VERSION" ]; then
            GOST_VERSION=$(curl --fail --silent --show-error \
              -H "authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/ginuerzh/gost/releases/latest \
              | jq -r '.tag_name' | cut -c 2-)
          else
            GOST_VERSION="$INPUT_GOST_VERSION"
          fi
          echo "GOST_VERSION=${GOST_VERSION}" >> "$GITHUB_OUTPUT"

      # gost version must be <number>.<number>.<number>
      - name: Verify gost version
        env:
          GOST_VERSION: ${{ steps.get-gost-version.outputs.GOST_VERSION }}
        run: |
          if [[ ! "$GOST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid gost version: $GOST_VERSION"
            exit 1
          fi

      - name: Get WARP client version
        id: get-warp-client-version
        env:
          SUITE: ${{ matrix.variants.suite }}
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ ${SUITE} main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          echo "WARP_VERSION=$(apt-cache show cloudflare-warp | grep '^Version:' | awk '{print $2}' | sed 's/-[0-9]*$//')" >> "$GITHUB_OUTPUT"

      # WARP client version must be <number>.<number>.<number>.<number>
      - name: Verify WARP client version
        env:
          WARP_VERSION: ${{ steps.get-warp-client-version.outputs.WARP_VERSION }}
        run: |
          if [[ ! "$WARP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid WARP client version: $WARP_VERSION"
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            GOST_VERSION=${{ steps.get-gost-version.outputs.GOST_VERSION }}
            WARP_VERSION=${{ steps.get-warp-client-version.outputs.WARP_VERSION }}
            COMMIT_SHA=${{ github.sha }}
            BASE_IMAGE=${{ matrix.variants.base_image }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ matrix.variants.tag_suffix }}latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ matrix.variants.tag_suffix }}${{ steps.get-warp-client-version.outputs.WARP_VERSION }}-${{ steps.get-gost-version.outputs.GOST_VERSION }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ matrix.variants.tag_suffix }}${{ steps.get-warp-client-version.outputs.WARP_VERSION }}-${{ steps.get-gost-version.outputs.GOST_VERSION }}-${{ github.sha }}
